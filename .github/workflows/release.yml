name: Release

# Publishes on a version-tag push (e.g. `git tag v0.1.0 && git push --tags`).
#
# PREREQUISITE — the matching minimum kglite release in the root Cargo.toml
# must already be available on crates.io and PyPI before tagging codingest.
#
# Order: crates.io first (`codingest` → `codingest-cli` → `codingest-mcp`,
# dependency order), then the wheels + sdist → PyPI, then the GitHub Release.
# Every publish path is idempotent-safe: the crate job skips a version already on
# crates.io (HTTP-404 guard), the PyPI publish uses `skip-existing: true`, and
# softprops updates an existing release — so a re-run after a partial failure is
# safe.
#
# A `v*` TAG PUSH IS THE ONLY TRIGGER, deliberately. There used to be a
# `workflow_dispatch:` here too, and on a dispatch run GITHUB_REF_NAME is a
# BRANCH: `${GITHUB_REF_NAME#v}` is then `main`, the changelog lookup asks for a
# `## [main]` section and silently degrades to auto-generated notes, the
# binaries are packaged `codingest-main-linux-x86_64.tar.gz`, and
# `softprops/action-gh-release` — handed a non-tag ref — CREATES a tag and
# release named after the branch. Every step of that is green.
#
# The alternative to removing the trigger was a degraded dry-run mode, i.e.
# conditioning every publish and release action on `github.ref_type == 'tag'`.
# Rejected: each of those conditions is itself something branch CI can never
# exercise, so it would add unfailable surface to buy a rehearsal `ci.yml`
# already gives on every push (workspace build, wheel build + verify_wheel,
# and the release-gates unit suite). Re-running a release is done with GitHub's
# "Re-run jobs" on the tag's own run, which keeps GITHUB_REF_TYPE=tag.
#
# `Guard: this ref may publish` is the backstop, in every job that publishes or
# names an artifact after the ref. See assert_publish_ref in
# scripts/release_gates.sh.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- crates.io first, in dependency order ----
  publish-crate:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # FIRST, before a toolchain is even installed: nothing downstream may run
      # on a ref that is not a `v<N.N.N>` tag. This job gates every other job in
      # the file (`needs: [publish-crate]` transitively reaches all of them), so
      # failing here stops the whole publish path. Repeated in publish-pypi and
      # release-binaries anyway — that reachability is a property of today's
      # `needs:` graph, not an invariant.
      - name: Guard the publish ref
        shell: bash
        run: |
          scripts/release_gates.sh assert_publish_ref \
            "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_EVENT_NAME"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python (libpython for the workspace's PyO3 crate)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-crate
          workspaces: ". -> target"

      # The logic lives in scripts/release_gates.sh, NOT inline here: this
      # workflow only runs on a `v*` tag push, so nothing written inline can
      # ever be exercised — or seen to fail — by branch CI. The script is
      # unit-tested on every push by tests/release/test_release_gates.py
      # (the `release-gates` job in ci.yml). Emits `version` plus
      # `publish_codingest`, `publish_codingest_cli`, `publish_codingest_mcp`.
      #
      # Two gates run inside it, both BEFORE anything reaches $GITHUB_OUTPUT:
      #   1. the version must match ^[0-9]+\.[0-9]+\.[0-9]+;
      #   2. on a tag build (GITHUB_REF_TYPE=tag, supplied by the runner) the
      #      manifest version must equal ${GITHUB_REF_NAME#v}.
      # (2) is the one that matters most: tagging v0.1.4 with the manifest at
      # 0.1.3 otherwise produces a fully green run that publishes nothing and
      # still cuts a GitHub Release with the previous version's artifacts.
      - name: Check which crates need publishing
        id: check
        shell: bash
        run: |
          scripts/release_gates.sh check_crates_to_publish \
            Cargo.toml codingest codingest-cli codingest-mcp

      # 1. codingest (the builder library — codingest-cli/mcp depend on it).
      - name: Publish codingest
        if: steps.check.outputs.publish_codingest == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p codingest --locked

      # 2. Let crates.io's sparse index surface the new codingest version so the
      # downstream `cargo publish -p codingest-cli/-mcp` can resolve it. Fixed
      # sleep + a `cargo search` readiness probe (polling the JSON API hits the
      # 403 rate limit; `cargo search` uses the same resolver the next publish
      # will). Only needed when a dependent is also publishing this run.
      - name: Wait for crates.io index propagation (codingest)
        if: steps.check.outputs.publish_codingest == 'true' && (steps.check.outputs.publish_codingest_cli == 'true' || steps.check.outputs.publish_codingest_mcp == 'true')
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "Sleeping 90s for crates.io index propagation of codingest $VERSION..."
          sleep 90
          for i in $(seq 1 5); do
            if cargo search codingest --limit 1 2>&1 | grep -E "^codingest = \"$VERSION\""; then
              echo "codingest $VERSION visible to cargo resolver (attempt $i)"; exit 0
            fi
            echo "Not yet visible (attempt $i), waiting 30s..."; sleep 30
          done
          echo "WARNING: cargo search didn't find codingest $VERSION; proceeding — the"
          echo "next cargo publish will surface a real error if the index isn't ready."

      # 3. codingest-cli (depends on codingest).
      - name: Publish codingest-cli
        if: steps.check.outputs.publish_codingest_cli == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p codingest-cli --locked

      # 4. codingest-mcp (depends on codingest). Cosmetic settling window when
      # both cli and mcp publish this run (mcp doesn't depend on cli).
      - name: Wait before publishing codingest-mcp
        if: steps.check.outputs.publish_codingest_cli == 'true' && steps.check.outputs.publish_codingest_mcp == 'true'
        run: sleep 60
      - name: Publish codingest-mcp
        if: steps.check.outputs.publish_codingest_mcp == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p codingest-mcp --locked

  # ---- then the wheels + sdist (the `codingest` PyPI distribution) ----
  build-wheels:
    name: Build wheel - ${{ matrix.os }} - ${{ matrix.target }}
    needs: [publish-crate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (manylinux/musllinux containers via maturin-action).
          - os: ubuntu-latest
            target: x86_64
            manylinux: '2014'
          - os: ubuntu-latest
            target: aarch64
            manylinux: '2_28'
          # macOS — native arm64 + cross x86_64 (Apple ships both SDKs).
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          # Windows.
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Verify wheel entry points and payload
        run: python scripts/verify_wheel.py "dist/*.whl"
      # `if-no-files-found: error` is load-bearing, not tidiness. The action's
      # DEFAULT is `warn`: a leg that somehow reaches this step without having
      # produced a wheel uploads an EMPTY artifact and the job stays green. The
      # PyPI publish then runs with `skip-existing: true`, which swallows the
      # resulting partial wheel set without a word, and nothing in this flow
      # checks the artifact SET (only the version). Deleting this line restores
      # that silent-partial-release path. Second net: `Verify the artifact set
      # is complete` in publish-pypi.
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    needs: [publish-crate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # KEEP THE `shell: bash` LINE BELOW — it is load-bearing and invisible.
      # GitHub's default `run` shell is `bash -e {0}`; an explicit `shell: bash`
      # is `bash --noprofile --norc -eo pipefail {0}`. The delta is PIPEFAIL,
      # and this step is a pipeline whose producer can fail while its consumer
      # succeeds.
      #
      # Measured, not assumed (probes run 2026-07-29 on bash 3.2):
      #   * a licence-LESS sdist goes red under `bash`, `bash -e` and
      #     `bash -eo pipefail` alike — grep prints 0, and `test "$count" -eq 1`
      #     is the step's last command, so its status is the step's. The plan's
      #     "deleting shell: bash silently kills the check" is too strong for
      #     that case; recorded here so nobody re-derives it the hard way.
      #   * a `tar` that DIES PARTWAY (truncated/corrupt archive) after listing
      #     a LICENSE entry is the case that needs pipefail: grep exits 0,
      #     count=1, and the step is green on a broken archive. With pipefail
      #     the substitution inherits tar's status and `-e` kills the step
      #     (probe: rc 0 without pipefail, rc 2 with it).
      # So the line buys corrupt-archive detection, not the empty case. It also
      # still has no `-u`: a typo'd variable expands to empty instead of
      # erroring, which is what `test -n "$archive"` stands in for by hand.
      # If this ever grows a line AFTER `test "$count" -eq 1`, the check stops
      # being the step's exit status and starts depending on `-e` alone.
      - name: Verify sdist license payload
        shell: bash
        run: |
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          count=$(tar -tzf "$archive" | grep -Ec '/LICENSE$')
          test "$count" -eq 1
      # See the wheels upload above: the default is `warn`, which would let an
      # empty sdist artifact through and hand publish-pypi a set with no sdist.
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI + GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing (OIDC): no API token — the maintainer registers this
    # repo + workflow as a PyPI publisher, and id-token:write mints the
    # short-lived credential at publish time. `contents: write` lets the same
    # job cut the GitHub Release.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      # This job reads GITHUB_REF_NAME for the changelog lookup and hands the
      # ref to softprops, which creates the tag if it does not exist. Guard it
      # here too rather than trusting publish-crate to have run.
      - name: Guard the publish ref
        shell: bash
        run: |
          scripts/release_gates.sh assert_publish_ref \
            "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_EVENT_NAME"
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      # THE LAST CHANCE TO NOTICE A PARTIAL RELEASE. This step used to be
      # `ls -la dist`: verification-shaped, asserting nothing, on a directory
      # `download-artifact` always creates. Everything downstream is silent
      # about a short set — `skip-existing: true` treats the missing wheels as
      # "nothing to do", and the flow only ever verifies the *version* on PyPI,
      # never the artifact *set*.
      #
      # The expectation is DERIVED from the build-wheels matrix above (one wheel
      # per leg, mapped to the platform tag it must carry) plus exactly one
      # sdist, so a hardcoded count cannot go stale behind a matrix edit: add a
      # leg and the expected set grows with it; add a leg with an os/target the
      # mapping does not know and the gate hard-fails asking for a mapping.
      # Logic + unit tests: scripts/release_gates.sh assert_artifact_set,
      # tests/release/test_release_gates.py.
      - name: Verify the artifact set is complete
        shell: bash
        run: |
          scripts/release_gates.sh assert_artifact_set dist .github/workflows/release.yml
      # BEFORE the PyPI publish, not after it. A missing changelog section is now
      # fatal on a tag build (below), and a fatal check is worth more on the near
      # side of an irreversible action: PyPI accepts a filename exactly once.
      # Nothing here needs the publish to have happened.
      #
      # Two statements, not one nested `$( )`: an assertion inside a
      # substitution nested in another command has its status swallowed by the
      # outer command. See the header of scripts/release_gates.sh.
      #
      # GITHUB_REF_TYPE is passed because it is what makes the section
      # MANDATORY. A missing `## [x.y.z]` used to set has_notes=false and fall
      # through to a second release step with `generate_release_notes: true` —
      # a silent downgrade from the curated changelog to a list of commit
      # subjects, and a downgrade that fired precisely when something was wrong
      # (the CHANGELOG was never promoted, or the tag disagrees with the
      # manifest). That fallback step is GONE, not merely unreachable: leaving a
      # degrade-quietly branch in the file is an invitation to re-enable the
      # behaviour by relaxing the gate. Emits `has_notes`.
      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          version=$(scripts/release_gates.sh version_from_ref "$GITHUB_REF_NAME")
          scripts/release_gates.sh changelog_notes "$version" CHANGELOG.md /tmp/release_notes.md "$GITHUB_REF_TYPE"
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-runs: a file already on PyPI is skipped, not an error.
          skip-existing: true
      - name: Create GitHub Release (with changelog body)
        if: steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: /tmp/release_notes.md

  # ---- best-effort: attach standalone codingest-cli / codingest-mcp binaries ----
  # Convenience for users who want the CLI / MCP server without `cargo install`
  # or the wheel. Best-effort: a build hiccup here must not block the crates.io
  # or PyPI publish.
  #
  # `needs: [publish-crate, publish-pypi]` — the publish-pypi edge FIXES A RACE,
  # it does not add a gate. Both this job and publish-pypi call
  # softprops/action-gh-release, and whichever arrives first CREATES the release;
  # the second only updates it. This job needed just publish-crate, so it
  # habitually won — creating the release with an EMPTY body, after which
  # publish-pypi's `body_path` update was the only thing that ever wrote the
  # changelog into it. Ordering it after publish-pypi means the release is
  # always created with its notes and this job only attaches files.
  #
  # THE NON-BLOCKING PROPERTY IS UNCHANGED, and it is worth being precise about
  # why, because "add a needs: edge" sounds like it could not be. `needs:` makes
  # THIS job wait for that one; blocking would require the reverse edge, some
  # other job declaring `needs: release-binaries`. No job in this file does
  # (publish-crate needs nothing, build-wheels/build-sdist need publish-crate,
  # publish-pypi needs the two build jobs) — which is what actually makes this
  # job unable to block anything, dependency-graph-first and
  # `continue-on-error` second. A unit test asserts no job ever gains that
  # reverse edge. By the time this job runs, both publishes are already done, so
  # even a hard failure here cannot reach them.
  #
  # THE TOLERANCE IS PER-STEP, NOT PER-JOB, and that is the whole point. This
  # job used to carry `continue-on-error: true` at JOB level, which does buy the
  # best-effort property — but buys it a second time (see above: the dependency
  # graph already grants it) at the price of making EVERY assertion inside the
  # job unable to fail, including the `Guard the publish ref` step below. A job
  # that cannot go red is a job whose green means nothing; upstream reported this
  # exact pattern holding a job green for two days while two false claims were
  # committed on the strength of it.
  #
  # So the flag now sits on the three steps that are genuinely fragile —
  # `Package binaries (unix)`, `Package binaries (windows)`, `Attach to the
  # GitHub Release` (archive plumbing, and a network call to the releases API).
  # Everything else MUST be able to fail: the ref guard, checkout, toolchain,
  # cache, and `cargo build --release`, which is the same build ci.yml runs on
  # every push — breaking at tag time is a regression, not a hiccup.
  #
  # A hard failure still short-circuits the rest of the job (GitHub skips the
  # remaining steps), so a broken build never reaches packaging. What step-level
  # tolerance newly allows is packaging failing and the job CONTINUING to the
  # attach step — hence the `if: hashFiles('out/*')` guard on it. `success()`
  # would not do: a `continue-on-error` step's CONCLUSION is success, so
  # `success()` stays true after a tolerated packaging failure and softprops
  # would be asked to attach nothing.
  release-binaries:
    name: Release binaries - ${{ matrix.os }}
    needs: [publish-crate, publish-pypi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      # LOAD-BEARING, and more so now than before. `fail-fast` defaults to TRUE:
      # one red leg cancels its siblings in flight. Under the old job-level
      # `continue-on-error` no leg could go red, so this line was belt-and-
      # braces; with tolerance narrowed to the packaging steps a leg CAN fail
      # (a broken build, a bad ref), and without this the macOS and Linux legs
      # would be cancelled mid-package by the Windows one. Deleting it silently
      # converts one failed platform into three missing archives. A unit test
      # asserts it is still here.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-aarch64
          - os: windows-latest
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      # THE JOB THAT NAMES FILES AFTER THE REF. Both Package steps below
      # interpolate GITHUB_REF_NAME straight into an archive filename, and the
      # attach step hands the ref to softprops, which creates a tag+release if
      # one does not exist. Off a tag that produces `codingest-main-…` archives
      # attached to a release named `main`. This guard carries NO
      # `continue-on-error` — under the old job-level flag it could only ever
      # fail quietly, which is the single strongest reason that flag had to be
      # narrowed. It runs before anything is built.
      - name: Guard the publish ref
        shell: bash
        run: |
          scripts/release_gates.sh assert_publish_ref \
            "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-bins-${{ matrix.os }}
          workspaces: ". -> target"
      - name: Build codingest-cli + codingest-mcp (release)
        run: cargo build --release -p codingest-cli -p codingest-mcp
      # The three steps below — and ONLY these three — are the best-effort part.
      # Archive plumbing and a call to the GitHub releases API: fragile in ways
      # that have nothing to do with whether codingest is correct, and already
      # published-and-done by the time they run.
      - name: Package binaries (unix)
        continue-on-error: true
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C target/release -czf "out/codingest-${GITHUB_REF_NAME}-${{ matrix.suffix }}.tar.gz" codingest codingest-mcp
      - name: Package binaries (windows)
        continue-on-error: true
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path target/release/codingest.exe, target/release/codingest-mcp.exe `
            -DestinationPath "out/codingest-$env:GITHUB_REF_NAME-${{ matrix.suffix }}.zip"
      # GUARDED because the Package step above is now allowed to fail. A
      # `continue-on-error` step reports CONCLUSION success, so the implicit
      # `success()` on this step stays true after a tolerated packaging failure
      # and softprops would be handed an empty/absent `out/` — which it treats
      # as "create/update the release with no files", i.e. a silent no-op that
      # looks identical to a successful attach. `hashFiles` returns the empty
      # string when its glob matches nothing (and does not error on a missing
      # directory), so this asks the only question that matters: is there
      # anything to attach?
      - name: Attach to the GitHub Release
        continue-on-error: true
        if: hashFiles('out/*') != ''
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
