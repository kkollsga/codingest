[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "codingest"
description = "Build fast, queryable code graphs for AI agents, MCP code review, and local or GitHub repository analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kristian dF Kollsgård", email = "kkollsg@gmail.com"}
]
keywords = ["ai-agents", "mcp", "code-review", "knowledge-graph", "code-analysis", "github", "tree-sitter", "cypher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

# The wheel bundles codingest's native builder (tree-sitter grammars included —
# nothing else to install) but reuses the kglite engine for the returned graph:
# `build()` serializes to `.kgl` and hands off to the installed `kglite` wheel's
# `load()`. So the returned object is a real `kglite.KnowledgeGraph`, and the
# wheel depends on kglite at runtime. Keep the Python engine aligned with the
# Rust crates so both halves use the same persistence and MCP fixes.
#
# The upper bound is a `.kgl` format guard, not stylistic. The two halves of
# this handoff are versioned independently: the *Rust* kglite compiled into
# this wheel writes the bytes, and the separately-installed *Python* kglite
# wheel reads them. KGLite deliberately hard-breaks the `.kgl` format across
# minor releases (e.g. the v3->v4 break, which refuses old files outright), so
# pip must never be free to pair our writer with a reader from a different
# minor. This range therefore mirrors the Cargo semver range for the pin above
# (`version = "0.15.3"` == `>=0.15.3,<0.16.0`) exactly — bump both together.
dependencies = [
    "kglite>=0.15.3,<0.16",
]

[project.urls]
Homepage = "https://github.com/kkollsga/codingest"
Documentation = "https://codingest.readthedocs.io"
Repository = "https://github.com/kkollsga/codingest"
Issues = "https://github.com/kkollsga/codingest/issues"

# Bundled Rust console scripts. The CLI and builder-aware MCP composition are
# linked into this wheel's existing extension; thin Python shims forward argv.
# KGLite owns graph serving and pulls generic MCP infrastructure from
# mcp-methods, while Codingest injects the source builder. Thus
# `pip install codingest` is the complete installation path.
[project.scripts]
codingest = "codingest.cli:main"
codingest-mcp = "codingest.mcp_server:main"

[tool.pytest.ini_options]
# Only the live codingest-py suite. The dormant `tests/python-legacy/` tree
# imports the removed `kglite.code_tree` module and must NOT be collected.
testpaths = ["tests/python"]

[tool.maturin]
manifest-path = "crates/codingest-py/Cargo.toml"
# Rename the wheel's extension so the package's `from .codingest import *`
# finds it (maturin's default would use the crate's `[lib] name`).
module-name = "codingest.codingest"
# extension-module is added here (not as a Cargo default) so plain
# `cargo build` / `cargo test` still link. Default features (abi3 + docs)
# are kept, so the wheel ships the docs pass. Mirrors kglite-datasets-py.
features = ["python-extension"]
python-source = "."
