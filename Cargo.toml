[workspace]
members = [
    "crates/codingest",
    "crates/codingest-cli",
    "crates/codingest-mcp",
    "crates/codingest-py",
]
resolver = "2"

[workspace.package]
version = "0.2.16"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kkollsga/codingest"

[workspace.dependencies]
base64 = "0.22"
sha2 = "0.11"
# kglite engine + MCP server — imported as crates.io libraries. The 0.16.22
# floor spans two upstream releases: codingest never took 0.16.21, so 0.16.21
# and 0.16.22 land here together. Where they land for us:
#   * kglite-mcp-server (embedded unchanged via codingest-mcp's
#     run_with_extensions): a `skills:` pack declared in a manifest but missing
#     on disk now FAILS the boot. It used to fail the whole registry build and
#     boot anyway with every skill gone — the bundled methodology included —
#     while the graph tools answered normally and `--selftest` printed PASSED;
#     `--selftest` now also prints the number of skills the session serves.
#     codingest ships no manifest and declares no skills pack, so no server we
#     start can reach it, but an operator manifest pointed at codingest-mcp can.
#     `save_graph(force: true)` now requires the write opt-in (`--writable` or
#     `extensions.writable: true`) and is refused on a server that registers
#     `save_graph` alone via `builtins.save_graph: true`; a save that persisted
#     only boot configuration says so instead of reporting a node count nothing
#     moved, and a refused save on a clean server says "Nothing was changed
#     here" rather than claiming unsaved changes are still queryable. The lease
#     record's `since=` / `released=` move to second-precision UTC (older
#     local-offset records still parse).
#   * kglite core: additive for us, breaking for callers we are not.
#     `KgError::CypherTimeout` gains a `message` field and real
#     `elapsed_ms`/`limit_ms`, and a fired deadline now raises
#     `CypherTimeoutError` instead of `CypherExecutionError` — codingest names
#     no `KgError` variant and catches no kglite Python exception, so the
#     retyping reaches our users only through kglite's own surface (a
#     `codingest query --timeout` that fires reports through kglite's error,
#     whose class changed). `ServerExtensions::read_only()` and
#     `kglite::api::introspection::TypeCapabilities` are new and uncalled here;
#     `ServerExtensions::default().with_workspace_graph(...)` is a builder
#     chain, so a struct that gained a field is not a literal break for us.
#     The blueprint spec structs (`Blueprint`, `Settings`, `NodeSpec`, `FkEdge`,
#     `JunctionEdge`) gained fields and `JunctionEdge::target` became
#     `Vec<String>` — a struct-literal break codingest cannot hit: it builds no
#     blueprint and calls neither `from_blueprint` nor `from_records`, so the
#     now-honoured `on_missing_endpoint` spec key changes nothing here either.
#     Ranked retrieval (`text_bm25`, `vector_score`) on an unindexed property
#     now raises instead of answering zero rows, and `ontology_audit()` /
#     `edge_property_violation()` each yield one more column — codingest calls
#     none of them and pins no column set. `save_graph` / `write_kgl` /
#     `prepare_kgl_write` — every persistence entry we call — are
#     byte-identical, and the goldens prove it.
# It sits on the 0.16.20
# floor, which renames the MCP identity counter and makes a clean save a no-op.
# Where that landed for us:
#   * kglite-mcp-server (embedded unchanged via codingest-mcp's
#     run_with_extensions): the `<active_graph>` header and the
#     `— active graph:` footer now say `load="N"` / `· load N ·` instead of
#     `generation`, and gain a preceding `file_saved="<T>"` / `· file saved
#     <T>` field — the served path's publish time, omitted for a workspace
#     graph, which is every `--watch` / `set_root_dir` server. `reload_graph`
#     says "Load N on this server." codingest parses none of that text
#     (`git grep -n 'generation=\"\|· generation'` is empty here), so the
#     rename reaches our users only as changed server output. A write-enabled
#     server's `save_graph` is now a no-op ("Nothing to save: …") unless a
#     boot-time manifest ontology is unpersisted or `force: true` is passed —
#     codingest ships no manifest and declares no ontology, so the affected
#     path is one an operator reaches by hand. `extensions.writable: true` is
#     now equivalent to `--writable`; `builtins.save_graph: true` alone
#     registers only `save_graph` and leaves `cypher_query` read-only (that
#     was always true — 0.2.14's CHANGELOG entry here repeated the upstream
#     docs' error and said it enabled writes). Unknown `extensions.*` keys
#     warn at boot; every read on a `--writable` server now carries the
#     identity footer it was missing.
#   * kglite core: additive only. `kglite::api::io::GraphFileIdentity` gains
#     `modified()`; a released `GraphWriterLease` appends `released=<time>`
#     to `<path>.lock-owner`. codingest names neither type and reads no
#     `.lock-owner`. `save_graph` / `write_kgl` / `prepare_kgl_write` — every
#     persistence entry we call — are byte-identical, and the goldens prove
#     it. The optional `fastembed` backend moved 5 -> 6; codingest enables no
#     kglite features (`default-features = false`), so it is not in our tree.
# It sits on the 0.16.19
# floor, the lazy-writer-lease + automatic-refresh release. Where that landed
# for us:
#   * kglite-mcp-server (embedded unchanged via codingest-mcp's
#     run_with_extensions): a write-enabled server now takes the served
#     `.kgl`'s writer lease at its first unsaved change instead of at boot,
#     so several clients can boot off one manifest; a `--graph` server
#     stats the file per call and re-reads it when its identity moved, so a
#     `codingest build` that replaces the artifact reaches the server on
#     the next tool call with no `reload_graph`; `extensions.graph_watch` is
#     retired (a boolean only logs a warning — codingest ships no manifest
#     naming it); `save_graph` refuses to overwrite a file changed on disk;
#     `reload_graph` gains `discard_unsaved`; `--lease-label` /
#     `KGLITE_LEASE_LABEL` name the holder. Our workspace-graph hooks
#     (`build` / `is_relevant`) are untouched — the `--watch` path compiles
#     and behaves as before.
#   * kglite core: additive only. `kglite::api::io::WriteOwnership` (+
#     `BeginWrite`, `Discarded`, `WriteRefusal`), `GraphWriterLease::
#     acquire_labeled`, and `kglite::api::make_dir_graph_mut_preserving_
#     lineage` are new; `LeaseHolder` gains a `label` field (a struct-literal
#     break codingest cannot hit — it never constructs one, never names
#     `GraphWriterLease`). `save_graph` / `write_kgl` / `prepare_kgl_write`
#     — every persistence entry we call — are byte-identical, and the goldens
#     prove it. The one code change on our side ADOPTS the new accessor:
#     codingest-cli's working-tree `set_instructions` is a configuration
#     write, exactly the case the accessor was published for, and on a
#     uniquely owned freshly built graph it is the same bytes as the
#     `Arc::make_mut` it replaces.
# It sits on the 0.16.18
# floor, an MCP-server robustness release — every change lives in
# kglite-mcp-server boot/extension handling, none in the engine:
#   * `extensions.csv_http_server` with no `port:` (or `port: 0`) binds an
#     OS-assigned port again (restores pre-rewrite behaviour; explicit
#     non-zero ports unchanged); a failed CSV bind or unresolvable
#     `source_root:` now degrades that peripheral with a warning instead of
#     killing the boot; a `bundled: repo_management` override is ignored with
#     a warning in modes where the framework never registers the tool
#     (mcp-methods pin 0.4.6 → 0.4.7). No `kglite::api`, Cypher, or storage
#     change — graph output cannot move, and the goldens prove it.
# It sits on the 0.16.17
# floor, the downstream compile-footprint release, shipped the same day as
# codingest's 2026-08-31 footprint request (a 265 MB debug rlib per kglite
# generation; ~100 GB of accumulated target dirs filled the build-cache disk
# to zero that morning):
#   * kglite now pulls `geo` with default-features = false — earcut/spade
#     (triangulation/Voronoi) gated APIs no kglite code path calls; five
#     transitive packages gone for every consumer. No kglite API or Cypher
#     behavior change (spatial functions unaffected), and codingest declares
#     no direct `geo` dependency, so there is nothing to re-declare here.
#     Graph output cannot move — the release contains zero engine changes —
#     and the goldens prove it.
#   * The same coordination delivered four unit-graph-verified invocation
#     fixes on OUR side (dedup of kglite rlib variants ~1.1 GB → ~190 MB per
#     generation): the parity gate and the bench/soak bins now run with
#     --workspace package selection instead of -p narrowing (narrowing
#     re-runs feature unification over fewer crates and forks the
#     -Cmetadata hash into a duplicate 265 MB kglite rlib — no feature
#     difference), `make gate`'s build step sees the full unit graph via
#     --all-targets, and the workspace root sets
#     [profile.dev.package."*"] debug = "line-tables-only" (measured
#     upstream: rlib −43%, debug tree −22%; backtraces keep file/line).
# It sits on the 0.16.16
# floor, the deadline-observance release, which lands on a surface we ship:
#   * codingest-cli documents a `--timeout` flag on `query`, and before
#     0.16.16 the deadline it sets was observed only inside the pattern
#     matcher — the MATCH row loops downstream of it (match-to-row conversion
#     with fused WHERE, comma-pattern join, subsequent-MATCH driving join,
#     path-binding propagation) ran to completion however long past the
#     deadline (upstream repro: a deadline set a quarter of the way in was
#     detected after 94% of the query had run; a downstream OOM-kill at
#     7.29 GB motivated the fix). Variable-length expansion also now observes
#     cooperative cancellation (Ctrl-C: observed at 112 ms instead of 3.93 s).
#     The timeout CONTRACT is unchanged — Err("Query timed out…"), no partial
#     rows — so our error mapping holds; the added poll measured flat on the
#     directly affected cells upstream, and our perf anchor verifies that
#     independently. Its one REMOVAL, `QueryDiagnostics::timed_out`, had no
#     writer anywhere in the engine (read `false` on every result ever
#     returned) and does not reach us: codingest names QueryDiagnostics
#     nowhere (grep: zero hits for QueryDiagnostics / timed_out). The rest is
#     additive or documentation: the api-facade now exports
#     `fluent::FilterCondition` (we use no fluent filters), GraphML gains a
#     `label` attr key (we export no GraphML), `describe()` badges loc and
#     geo independently, and `id(n)` is documented as reading the source
#     data's own `id` field.
# Evidence is the gate: build/clippy/`cargo test` incl. `golden_parity` green
# across the bump with zero source changes.
# It sits on the 0.16.15
# floor, which covered two upstream releases — there too the argument was not
# only "unreachable": two 0.16.14 fixes land on `.kgl` bytes codingest itself
# writes and reloads:
#   * 0.16.14's load-bearing pair. (1) Two saves of one graph write identical
#     `.kgl` bytes again: four persisted lists (the type-connectivity triples
#     and the property/composite/range index-key snapshots) were written in
#     hash-map iteration order, so OUR output files changed with nothing in
#     the graph changing. codingest writes every `.kgl` through
#     prepare_kgl_write/write_kgl, so this is our bytes — but NOT our
#     goldens, which digest the in-memory canonical rendering, never file
#     bytes, and no format changed (the same reader loads files written
#     either way). (2) A reloaded `.kgl` no longer reports every relationship
#     type as zero edges: the load derived the type-connectivity cache from
#     fabricated 0-count triples, and that cache is authoritative on read —
#     so `describe()` and planner selectivity over a LOADED codingest graph
#     (the CLI `query` path, any consumer of a saved graph) saw zeros over a
#     graph full of edges; the fix also distrusts already-written all-zero
#     files. Its BREAKING rename — `ExecuteOptions::max_rows` →
#     `max_work_units`, `with_max_rows` → `with_max_work_units`, no alias,
#     error text changed — does not reach us: every codingest ExecuteOptions
#     is built via `ExecuteOptions::eager(&params)`, and nothing here spells
#     max_rows (grep: zero hits) or matches the old error text. The
#     api-facade re-exports (DataFrame, PropMap, GraphEdgeRef, the
#     introspection result types) are additive; our kglite::datatypes import
#     paths stay valid.
#   * 0.16.15 is the load-memory program, additive at every surface we name:
#     LoadOptions (`storage` / `defer_index_rebuild` on the load itself),
#     estimate_load_memory + the max_load_mb ceiling, the row_limit result
#     cap with a mandatory truncation signal, KGLITE_TMPDIR, spill-dir race
#     and orphan-sweep fixes, and honest loader error kinds (malformed-file
#     refusals are InvalidData now; syscall errors name operation + path with
#     ErrorKind unchanged). `load_file` is unchanged — it IS the default
#     LoadOptions. ExecuteOptions and QueryDiagnostics each gain a public
#     field, a struct-literal break we are not exposed to (constructor-only
#     construction here), and defer_index_rebuild would be a no-op on our
#     graphs anyway: codingest creates no index (see the 0.16.13 note
#     below), so a load has nothing to defer. `.kgl` loads are 5-10% faster.
# Evidence is the gate: build/clippy/`cargo test` incl. `golden_parity` green
# across the bump with zero source changes.
# It sits on the 0.16.13
# floor, a LOCKSTEP REFRESH over four upstream releases. Two DIFFERENT
# arguments carried that, and they are worth keeping apart because one of them
# expires:
#   * 0.16.13 is ontology follow-ups plus a cluster of engine fixes that all
#     describe an INDEX answering wrongly — an index on `name` shadowing the
#     title fallback, indexed equality for an absent value, a WHERE-equality
#     index pre-filter pruning rows of the wrong type, a fluent where() over a
#     mixed-type set, and the materialized-supertype closure probe. Every one
#     is unreachable here for a single reason: codingest CREATES NO INDEX
#     (grep across crates/, tests/ and docs/ recipes: zero hits for
#     create_index / create_range_index / create_composite_index /
#     build_text_index / build_vector_index / CREATE INDEX). Note this is
#     "unreachable", NOT "unused" — the WHERE-equality shape it fixes
#     (`WHERE n.is_external = false`) is one we document and ship, so the day
#     anyone adds an index this argument is void and the fix becomes load-
#     bearing. Its Rust API note does not reach us either: `RelationshipDecl`
#     gained public `exempt`/`ancestry` fields, and codingest constructs no
#     RelationshipDecl (zero struct literals).
#   * 0.16.12 is entirely INSIDE the 0.16.11 ontology declaration layer:
#     `required_properties`/`property_types` were parsed and persisted but
#     never checked (they now emit audit rows), `inverse_name` stopped
#     auto-enrolling the physical-inverse check (it is a reading-direction
#     alias; opt in with `inverse_enforced: true`), and `enforcement` gained a
#     per-check `{check: severity}` map. Every one of those reaches a graph
#     only through a declaration codingest never installs — nothing here calls
#     `define_ontology`, so there is no declaration to audit, no blueprint gate
#     to fail, and no `SHOW ONTOLOGY` row to render.
#   * 0.16.11 adds the ontology declaration layer (`define_ontology`,
#     `materialize_ontology`, `SHOW ONTOLOGY`, `ontology_audit`), structured
#     table properties, and `MATCH (n:A|B)` label alternation. All three are
#     DECLARED features — a graph that declares none is byte-identical and
#     queries identically, and codingest declares none (see the standing ask in
#     inbox to emit a code-graph ontology: a FEATURE, not part of this floor).
#     Its one broad fix, `vacuum()` corrupting secondary labels, cannot reach us
#     — the builder never adds a secondary label and never vacuums. `describe()`
#     grew an `<ontology>` section (absent when nothing is declared) and a
#     sample-inferred `shape=` per property; the six rule procedures gained a
#     `rule` column, and codingest calls none of them.
#   * 0.16.10 is the BM25 text index (`build_text_index` / `text_bm25` /
#     `score_fuse`), vector-index catch-up, and the MCP `--parallel` /
#     `extensions.parallel` opt-in codingest asked for on 2026-08-22 — which
#     codingest-mcp inherits for free as a thin frontend over
#     kglite-mcp-server, off unless an operator turns it on. Its `.kgl` text-
#     index section is a rebuildable cache: a graph with no text index writes
#     byte-identical files and older files load unchanged, so the frozen
#     goldens hold. Two engine fixes land under us without a source change: a
#     `LIMIT` on an aggregating RETURN grouped by a node property silently
#     dropped rows, and a second `vector_score()`/`text_score()` in one query
#     returned the first call's score. `size()` on a bracket-delimited string
#     now counts characters, not JSON elements. Its Rust REMOVALS — the `spec`
#     parameter of `api::io::save_subset`, `EmbeddingStore::index` as a public
#     field, `build_vector_index`'s new trailing `auto_refresh_limit` — name no
#     symbol codingest uses (we import DirGraph, GraphRead, io::{load_file,
#     save_graph, write_kgl, prepare_kgl_write}, mutation::{add_nodes,
#     extend_graph}, param::kglite_value_to_json, session, code_entities,
#     datatypes).
# Evidence is the gate: build/clippy/`cargo test` incl. `golden_parity` green
# across the bump with zero source changes.
# It sits on the 0.16.9
# floor, itself a LOCKSTEP REFRESH: 0.16.9 replaces the software CRC32 in `.kgl`
# section verification with crc32fast (loads of digest-carrying files ~1.6x
# faster; digest VALUES unchanged, byte-identical files, golden digests do not
# move), and 0.16.8 is engine correctness fixes — count(DISTINCT <rel var>),
# aggregating WITH+LIMIT pushdown, composite-index key order, mapped-storage
# property staleness — none of which reaches a query or API codingest ships
# (our one count(DISTINCT …) counts a node variable). Python-side,
# `add_connections_internal` disappeared from the class; codingest never
# called it.
# It sits on the 0.16.7
# floor, a lockstep refresh in the same pattern (as was 0.16.5): 0.16.7 converts
# a family of Python-facing silent-wrong-answer paths into typed errors
# (`as_dict` removal; collision-raising `degrees()`/`embeddings()`/
# `to_networkx()`; `compare()` traversal errors as `kglite.ArgumentError`) —
# grep confirms codingest calls none of them — and the evidence is the gate:
# build/clippy/`cargo test` incl. `golden_parity` green across the bump with
# zero source changes.
# It sits on the 0.16.6
# floor, which picks up the advisory traversal caps (our reported LIMIT bug: capped
# pass + exact uncapped retry), the BREAKING var-length trail-semantics fixes
# (a closed trail re-emits its source; a segment's relationships are visible to
# its clause's uniqueness check), and per-section .kgl CRC32s. Zero source
# changes: the Rust API delta is purely additive for every symbol we name, and
# add_nodes/add_connections behavior is unchanged, so the frozen goldens hold.
# The .kgl format gains a `section_digests` metadata field — additive in BOTH
# directions (serde default/skip), so unlike 0.16.2 a stale .kgl needs NO
# rebuild; saves pay the CRC pass (upstream ~+11-15%). The semantics change IS
# observable in query answers on cyclic graphs — pinned by
# crates/codingest/tests/traversal_semantics.rs, which is red on 0.16.5 and
# green on 0.16.6 by design.
#
# History — the 0.16.5 floor was a LOCKSTEP REFRESH, not a fix we needed:
# nothing in 0.16.3-0.16.5
# reaches a path codingest exercises, and the evidence is the gate rather than
# the changelog. `golden_parity` is green and `kgl_bytes_are_stable_across_builds`
# holds, so the frozen goldens are byte-identical across the bump; the fixture
# corpus builds 405 nodes / 616 edges docs-on and 398 / 596 docs-off on both
# 0.16.2 and 0.16.5. Perf is flat: three interleaved A/B pairs per docs mode on
# corpus ad8b3084…, control `defs_per_file` moving +0.0%, every cell flat except
# `varlen_callers_1_3` at -9.7% in BOTH modes (0.031 -> 0.028 ms) — a small
# consistent win, plausibly the PropMap refcount clone below. A same-machine
# before/after pair taken 20 minutes apart instead read +50% on three cells with
# the control at +15%; that is the instrument, and the interleaved pairs are why
# the flat reading is the one recorded (doctrine R11).
#
# What each release contains, and why none of it lands on us:
#   * 0.16.5 is a BREAKING Rust API change — node, relationship and map
#     properties are a `kglite::datatypes::PropMap`, not a
#     `BTreeMap<String, Value>`. We are not exposed: codingest names neither
#     `NodeValue::properties` nor `RelValue::properties`, and its one
#     `Value::Map` site (docs/mod.rs) matches the wildcard `Value::Map(_)` to
#     stringify a non-scalar, which binds nothing. The workspace compiles clean
#     with no source change. No file format moved — postcard's map framing is
#     identical — which is what lets the goldens hold. Also in 0.16.5:
#     relationship constraints, CDC before-images and selectors, and a
#     re-save determinism fix. codingest declares no constraints, consumes no
#     CDC, and only ever writes FRESH saves, so the re-save fix (and its
#     property-name reordering) cannot reach our bytes.
#   * 0.16.4 adds the opt-in parallel Cypher runtime (off by default and NOT
#     exposed by the MCP server), property-type constraints, and CDC v1. Its
#     one format note — a `.kgl` carrying a property-type constraint does not
#     load on 0.16.3 or earlier — is inert here because codingest declares
#     none, so our files stay readable by an older engine. That is why the
#     Python floor moves for LOCKSTEP, not because the format broke: the
#     `test_kglite_cargo_and_python_floors_are_in_lockstep` gate requires
#     Cargo.toml, pyproject.toml and ci.yml to state one floor, and a
#     "the reader could stay lower" argument is exactly the drift it exists to
#     stop.
#   * 0.16.3 is MCP-side: `reload_graph`, `extensions.graph_watch`, and
#     `extensions.tools_allow`. It also carries mcp-methods 0.4.5, which makes
#     the GitHub tools require an explicit `builtins.github: true` — codingest-mcp
#     registers no GitHub tools and ships no manifest declaring them, so its
#     agent-visible tool surface is unchanged.
#
# Floor history below; the 0.16.2 entry is the last one that changed our output.
# The 0.16.2 floor fixed the edge-property type registry: `add_connections` — the ONLY
# edge path codingest uses (builder/load.rs, other_edges.rs, cross_lang.rs,
# docs/mod.rs) — registered every property as "Unknown" instead of its observed
# type. Measured on a two-function Python corpus: `CALL
# db.schema.relTypeProperties()` answered `:CALLS.call_count -> ["Unknown"]`
# built on 0.16.1 and `["Long"]` built on 0.16.2. So this is output-affecting
# for schema consumers (graph_overview, Neo4j-shaped clients) and a real floor,
# not a lockfile refresh — but it is metadata beside the property values, so
# the frozen parity goldens are byte-identical across the bump. Per the
# changelog a graph written before the fix keeps its "Unknown"s until its edges
# are rewritten: a stale `.kgl` must be REBUILT, not just re-read on the new
# engine. Nothing else in 0.16.2 reaches us — it is Bolt-server Neo4j/APOC
# compatibility, Java binding work, and an `id(n)` projection fast path.
# It sits on the 0.16.1
# floor, which picks up the wire-JSON break (kglite_value_to_json emits real JSON for
# nine variants — our CLI renders through it, so expectations pin the NEW
# shapes and an older engine would fail them) on top of the 0.16.0
# base, which is a HARD floor, not a preference: 0.16.0 writes `.kgl` container v6,
# which kglite 0.15.14 and earlier refuse by version number. Because
# `codingest.build()` writes the bytes with the Rust engine compiled in here and
# reads them back through the separately-installed Python `kglite` wheel, the
# two sides must be on the same side of that break — hence `>=0.16.17,<0.17` in
# pyproject.toml, and hence a reader on 0.15.x is not "old but workable", it is
# a hard failure with `FileFormatError`.
# 0.16.0 also removed `DirGraph::enable_columnar` from the public API (every
# graph is columnar from its first node now); the two sites that open-coded
# `prepare_save` + `enable_columnar` before a `.kgl` write moved to the
# purpose-built `kglite::api::io::prepare_kgl_write`, which also keeps the
# graph's copy-on-write lineage across that mutation — our `Arc::make_mut`
# spelling did not.
# It sits on top of the 0.15.13 floor, which added a planner fix for joins
# filtered on a type's title/id field (anchored traversals 5.7-327x faster here;
# see BENCHMARKS.md 0.2.1), and the 0.15.11 floor before it, which brought three
# things, only one of which changed what we run:
#   * 0.15.10's `add_connections` resolves its edge-property columns once per
#     call instead of once per cell — upstream measured 66.7ms -> 30.4ms
#     (-54%) on 60k edges x 10 property columns. That is exactly the shape of
#     our `control_edges_df` handoff, so it lands on the `calls` stage.
#   * The `NodeData` -> `NodeView` API break from 0.15.9, made migratable in
#     0.15.11. 0.15.9 deleted `NodeData`'s inherent property accessors and
#     0.15.11 finally shipped reachable replacements: reads go through
#     `DirGraph::node_view(idx)`, and by-index writes through the inherent
#     `DirGraph::set_node_property(idx, "key", value)`. We migrated 21 read
#     sites and the 2 `revs`/`rev_fp` write sites in `rev.rs` for this floor.
#     It is a compile-time break only — the storage path behind both spellings
#     is the one the removed methods already called, so it is NOT
#     output-affecting.
#     NOTE: do NOT reach the write side via `GraphWrite::set_node_property`
#     with an `InternedKey::from_str` key. That key is never registered: it
#     reads back within the session but breaks property enumeration and is
#     silently dropped by `save_graph`. The inherent string-keyed calls
#     register the name; use them.
#   * 0.15.11's `kglite::api::embeddings` ingest API and `text_score()` query-
#     vector arguments — codingest consumes neither.
# Per the 0.15.9-0.15.11 changelogs, graph output, property encoding and
# `.kgl` serialization are unchanged; the frozen parity goldens are what
# proves it, and they must not move across this bump.
#
# Floor history. The 0.15.8
# floor added recorded storage modes, `--storage` conversion on an existing
# graph, and boot-validated Cypher recipe catalogs — none of which codingest
# consumes — plus two changes that do reach us: workspace-graph producers now
# receive deduplicated changed-path hints alongside full-build requests (our
# `with_workspace_graph` producer lives in codingest-mcp), and the optimized-
# plan cache no longer lets a write loop evict other graphs' cached read plans.
# `OpenGraphResult` gained a `converted_from` field — a documented struct-
# literal break we are not exposed to, as codingest constructs no
# `OpenGraphResult`. 0.15.7 aligned the embedded server on mcp-methods 0.4.4
# and rmcp 3.1.1; dynamic handlers use rmcp's response envelope while
# preserving their payloads and MCP behavior. The 0.15.6 engine fixes
# mixed-selection vector dispatch, mixed-metric exact search,
# community-detection modularity scoring, sampled-centrality validation, and
# persisted HNSW validation, while adding the bulk node-degree primitive and
# graph-algorithm/vector-search performance improvements. It builds on the two
# workspace controls codingest asked upstream for in 0.15.5:
# `workspace.sandbox_root`, a real containment boundary that confines
# `set_root_dir` to a subtree instead of trusting the caller's path, and
# `workspace.adopt_client_roots`. Both land on top of the generic
# workspace-graph hooks, tri-state `durable` levels, typed
# constraint/conflict exceptions carrying a stable `.code`, and the
# deterministic Postcard persistence stack inherited from 0.14.5/0.15.0-0.15.3.
# 0.15.4 is deliberately skipped: it was WAL/durability and mapped-graph work
# we consume none of — codingest uses no `durable=` level, no `MappedGraph`,
# and no disk storage. Neither 0.15.7 nor 0.15.8 changes the `kglite::api` we
# call, graph output, property encoding, or `.kgl` serialization.
# Keep both libraries aligned so the graph and server share one engine release.
kglite = { version = "0.16.22", default-features = false }
kglite-mcp-server = { version = "0.16.22", default-features = false }

# Dependency debuginfo capped at line tables (kglite coordination, 2026-08-31,
# after unbounded debug trees filled the build-cache disk to zero): a
# full-DWARF kglite rlib is ~336 MB, two-thirds DWARF type-name strings and
# ~5% code. Measured upstream on this exact dep tree: rlib −43%, whole debug
# tree −22%. Backtraces keep file/line; the only loss is variable inspection
# INSIDE dependency code. The "*" glob deliberately skips workspace members —
# our own crates keep full debuginfo. Do not reach for `strip` or
# `split-debuginfo` instead: both measured ZERO effect on rlib size upstream.
[profile.dev.package."*"]
debug = "line-tables-only"

# Mirror KGLite's release codegen so the standalone builder has
# performance parity with the in-tree component (see KGLite
# workspace Cargo.toml).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
