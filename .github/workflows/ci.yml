name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The codingest-py crate is a PyO3 extension (abi3, extension-module off
      # by default), so a plain `cargo build`/`clippy`/`test` of the workspace
      # links libpython — provide it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        # Includes crates/codingest/tests/parity.rs — the golden oracle
        # (golden_parity + rev_self_consistency). Goldens are committed
        # fixtures under crates/codingest/tests/goldens/; the test is offline.
        run: cargo test --workspace

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Create venv and install build + runtime deps
        # `kglite>=0.14.4,<0.15` is the runtime engine (the `.kgl`-bytes handoff loads
        # the built graph through the installed kglite wheel). maturin builds
        # the codingest extension into the venv.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin pytest "kglite>=0.14.4,<0.15"

      - name: Build the codingest extension into the venv (maturin develop)
        run: .venv/bin/maturin develop --release

      - name: Run the codingest-py acceptance suite
        # pyproject `testpaths = ["tests/python"]` scopes collection — the
        # dormant tests/python-legacy/ tree is never swept in.
        run: .venv/bin/python -m pytest tests/python -v --tb=short
