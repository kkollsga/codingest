name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The codingest-py crate is a PyO3 extension (abi3, extension-module off
      # by default), so a plain `cargo build`/`clippy`/`test` of the workspace
      # links libpython — provide it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        # Includes crates/codingest/tests/parity.rs — the golden oracle
        # (golden_parity + rev_self_consistency). Goldens are committed
        # fixtures under crates/codingest/tests/goldens/; the test is offline.
        run: cargo test --workspace

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.python-version }}-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Create venv and install build + runtime deps
        # `kglite>=0.14.5,<0.15` is the runtime engine (the `.kgl`-bytes handoff loads
        # the built graph through the installed kglite wheel). maturin builds
        # the codingest extension into the venv.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin==1.14.1 pytest==9.1.1 kglite==0.14.5

      - name: Build the codingest extension into the venv (maturin develop)
        run: .venv/bin/maturin develop --release

      - name: Verify the installed dependency graph
        run: .venv/bin/python -m pip check

      - name: Verify wheel-owned CLI and MCP launchers
        run: |
          .venv/bin/codingest --version
          .venv/bin/codingest-mcp --selftest --watch tests/corpus/agc_basic

      - name: Run the codingest-py acceptance suite
        # pyproject `testpaths = ["tests/python"]` scopes collection — the
        # dormant tests/python-legacy/ tree is never swept in.
        run: .venv/bin/python -m pytest tests/python -v --tb=short
