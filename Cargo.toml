[workspace]
members = [
    "crates/codingest",
    "crates/codingest-cli",
    "crates/codingest-mcp",
    "crates/codingest-py",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/kkollsga/codingest"

[workspace.dependencies]
base64 = "0.22"
# kglite engine + MCP server — imported as crates.io libraries. The 0.14.4
# floor brings the current Postcard-only persistence stack, deterministic
# embedding/timeseries serialization, and the MCP override/context fixes.
# Keep both libraries aligned so the graph and server share one engine release.
kglite = { version = "0.14.4", default-features = false }
kglite-mcp-server = { version = "0.14.4", default-features = false }

# Mirror KGLite's release codegen so the standalone builder has
# performance parity with the in-tree component (see KGLite
# workspace Cargo.toml).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
