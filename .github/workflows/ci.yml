name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The codingest-py crate is a PyO3 extension (abi3, extension-module off
      # by default), so a plain `cargo build`/`clippy`/`test` of the workspace
      # links libpython — provide it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        # Includes crates/codingest/tests/parity.rs — the golden oracle
        # (golden_parity + rev_self_consistency), which is ALSO the builder
        # determinism gate: golden_parity builds each corpus three times and
        # requires all three digests to agree with each other and the golden.
        # Goldens are committed fixtures under crates/codingest/tests/goldens/;
        # the test is offline and needs no sibling checkout.
        run: cargo test --workspace

  minimal-versions:
    name: Declared dependency floors resolve and compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The ONLY nightly consumer in this repo — there is no
      # rust-toolchain.toml, so every other job takes @stable and is unaffected
      # by nightly drift. `-Z direct-minimal-versions` is nightly-gated with no
      # stable equivalent; that gating is the entire reason this job is split
      # out rather than folded into rust-checks.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      # pyo3's build script probes for an interpreter even under abi3.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimal-versions
          workspaces: ". -> target"

      - name: Resolve every direct dependency at its declared floor
        # A version requirement like `anyhow = "1"` claims the code builds
        # against anyhow 1.0.0. Normal CI never tests that claim: the committed
        # Cargo.lock pins 1.0.104, so the floor is decoration and drifts
        # silently as the code starts using newer APIs. This step rewrites the
        # lock so each DIRECT dependency sits at the oldest version its own
        # declaration permits, making the next step test the claim for real.
        #
        # `direct-minimal-versions`, NOT `-Z minimal-versions`: the latter
        # applies the same floor-seeking to all ~350 transitive entries, whose
        # requirements are third-party and largely understated in exactly the
        # way this job exists to prevent. That would be structurally red
        # through no fault of ours and could never be made green. We are
        # answerable for what THIS workspace declares, and nothing else.
        #
        # The rewritten Cargo.lock is throwaway. Nothing commits it — this job
        # has no write step, and the runner's checkout is discarded when the
        # job ends, so the committed lock is untouched by construction.
        run: cargo update -Z direct-minimal-versions

      - name: Check the workspace against those floors
        # `check`, not `build` or `test`. The failure this job hunts is a
        # declared floor that cannot satisfy the code — which surfaces during
        # resolution (the step above) or type-checking, both fully covered
        # here. Codegen and test execution add minutes without adding a
        # distinct failure mode: a floor old enough to break at runtime but
        # new enough to type-check is not a shape we have seen, and the real
        # lock is what rust-checks builds and tests. `check` also avoids
        # linking libpython for the codingest-py cdylib.
        run: cargo check --workspace --all-targets

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint .github/workflows with actionlint
        # Nothing else in this repo checks the workflows themselves: a typo'd
        # matrix key, an undefined step id in an `if:`, or an unquoted shell
        # variable in a `run:` block is only discovered when the workflow runs
        # — and release.yml runs ONLY on a `v*` tag push, so for that file
        # "when it runs" is during a release. actionlint parses every workflow
        # statically and bundles shellcheck for the `run:` blocks, so both
        # classes are caught on every push instead.
        #
        # Pinned to an exact actionlint release rather than a moving tag: a
        # linter that silently gains rules turns an unrelated push red. The
        # docker:// form is the container action documented by actionlint
        # upstream and is why this job is ubuntu-only.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  bench-smoke:
    name: Bench determinism smoke (codingest_bench)
    runs-on: ubuntu-latest
    # A release build under `lto = "thin"` + `codegen-units = 1` (root
    # Cargo.toml) is the slow part; the bench run itself is sub-second on this
    # corpus. 30 minutes covers a fully cold cache with room to spare, and is a
    # ceiling rather than a budget — a run that approaches it means the cache
    # stopped working, which is worth surfacing as a failure.
    timeout-minutes: 30
    steps:
      # `fetch-depth` is left at the default 1 ON PURPOSE. The harness resolves
      # its corpus with `git ls-files --cached`, which reads the INDEX — history
      # depth is irrelevant to it, and a shallow clone still yields the complete
      # tracked file set at this revision.
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # pyo3's build script probes for an interpreter; the bin target pulls the
      # workspace in far enough to need it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          # Deliberately NOT the `rust-checks-ubuntu-latest` key. That job
          # builds the dev profile; this one builds `--release` with thin-LTO
          # and CGU=1. They share no artifacts, so pointing both at one key
          # would have each evict the other's cache on every run and neither
          # would ever hit — the opposite of the intent.
          shared-key: bench-smoke
          workspaces: ". -> target"

      - name: Run the bench determinism smoke
        # `cargo test --workspace` (rust-checks) proves the BUILDER is
        # deterministic via parity.rs's three-build digest comparison. This
        # proves the same thing one layer up, through the read path: two
        # independent builds must return byte-identical results for all 11
        # Cypher queries, executed via `kglite::api::session::execute_read` —
        # the pipeline an MCP/CLI user actually hits. A determinism bug that
        # lives in query evaluation rather than in graph construction is
        # invisible to a digest-of-the-graph check and visible here.
        #
        # The make target also asserts the harness resolved a `tracked-only`
        # corpus, so a silent fall back to building the working tree as-is
        # fails rather than quietly measuring untracked content.
        #
        # Until now this ran only in `make gate` on a developer's machine,
        # which means it ran when someone remembered to run it.
        run: make bench-smoke

  release-gates:
    name: Release-gate script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pytest
        # Same pins as the `python` job below. No other dependency: the suite
        # shells out to bash and stubs curl, so it needs nothing else.
        # pytest-timeout is not optional here — pyproject sets `timeout = 120`
        # in [tool.pytest.ini_options], and that option is only honoured if the
        # plugin is present. A job that installs bare pytest silently runs with
        # no ceiling at all, which is the failure this pin prevents.
        run: python -m pip install pytest==9.1.1 pytest-timeout==2.4.0

      - name: Unit-test scripts/release_gates.sh
        # release.yml runs ONLY on a `v*` tag push, so its gate logic can never
        # be exercised — or seen to fail — by branch CI. That logic therefore
        # lives in scripts/release_gates.sh, and this step drives every function
        # through both its pass path and its fail path on every push, plus
        # asserts release.yml still calls the tested code. Offline: the crates.io
        # probe indirects curl through CODINGEST_RELEASE_CURL, which is stubbed.
        # pyproject's `testpaths = ["tests/python"]` scopes the default
        # collection, so tests/release must be named explicitly here.
        run: python -m pytest tests/release -v

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.python-version }}-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Create venv and install build + runtime deps
        # `kglite>=0.16.15,<0.17` is the runtime engine (the `.kgl`-bytes handoff loads
        # the built graph through the installed kglite wheel). maturin builds
        # the codingest extension into the venv.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin==1.14.1 pytest==9.1.1 pytest-timeout==2.4.0 kglite==0.16.15

      - name: Build the codingest extension into the venv (maturin develop)
        # DECISION (2026-08-10): this job keeps `--release`, deliberately — it
        # is not an oversight that the Python job never exercises a debug build.
        # These are ACCEPTANCE tests: they assert the artifact users actually
        # install behaves correctly, so they must run against a ship-shape
        # (optimised, debug_assert-free) extension. The coverage a debug build
        # would add — `debug_assert!`, overflow checks, unoptimised codegen —
        # is already obtained on the Rust side, where `cargo test --workspace`
        # in rust-checks runs the whole builder unoptimised on both OSes. A
        # debug `maturin develop` here would duplicate that at several minutes
        # per matrix cell (4 cells) while weakening what this job uniquely
        # tests. Revisit only if a bug is ever found that a debug-profile
        # Python run would have caught and rust-checks did not.
        run: .venv/bin/maturin develop --release

      - name: Verify the installed dependency graph
        run: .venv/bin/python -m pip check

      - name: Verify wheel-owned CLI and MCP launchers
        run: |
          .venv/bin/codingest --version
          .venv/bin/codingest-mcp --selftest --watch tests/corpus/agc_basic

      - name: Run the codingest-py acceptance suite
        # pyproject `testpaths = ["tests/python"]` scopes collection — the
        # dormant tests/python-legacy/ tree is never swept in.
        run: .venv/bin/python -m pytest tests/python -v --tb=short

      - name: Verify the wheel's pip-installation contract
        # ONE matrix leg, not four. What this checks — console-script entry
        # points, the payload shims, the native extension, the kglite
        # requirement — is declared in pyproject/Cargo and is identical on
        # every OS and interpreter, so the other three legs would re-prove the
        # same metadata at several minutes each. The leg is pinned by value
        # rather than left to `matrix.os == runner.os` guesswork so a matrix
        # edit that renames a leg turns this into a NEVER-RUN step loudly (the
        # step disappears from the run) rather than silently.
        #
        # Why it exists: scripts/verify_wheel.py ran ONLY in release.yml, which
        # triggers on a `v*` tag push — i.e. a broken entry point was first
        # observed AFTER the crates.io publish in the same workflow, at the one
        # moment nothing can be un-shipped.
        #
        # `maturin build`, not `develop`: develop installs into the venv and
        # leaves no wheel on disk, and this script's whole subject is the wheel
        # ARCHIVE's contents. `--release` matches release.yml and, more
        # practically, reuses the artifacts the `maturin develop --release`
        # step above already built — a debug build here would be a second full
        # compile, not a saving.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          .venv/bin/maturin build --release --out dist
          .venv/bin/python scripts/verify_wheel.py "dist/*.whl"
