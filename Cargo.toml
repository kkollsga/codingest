[workspace]
members = [
    "crates/codingest",
    "crates/codingest-cli",
    "crates/codingest-mcp",
    "crates/codingest-py",
]
resolver = "2"

[workspace.package]
version = "0.2.6"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kkollsga/codingest"

[workspace.dependencies]
base64 = "0.22"
sha2 = "0.11"
# kglite engine + MCP server — imported as crates.io libraries. The 0.16.6
# floor picks up the advisory traversal caps (our reported LIMIT bug: capped
# pass + exact uncapped retry), the BREAKING var-length trail-semantics fixes
# (a closed trail re-emits its source; a segment's relationships are visible to
# its clause's uniqueness check), and per-section .kgl CRC32s. Zero source
# changes: the Rust API delta is purely additive for every symbol we name, and
# add_nodes/add_connections behavior is unchanged, so the frozen goldens hold.
# The .kgl format gains a `section_digests` metadata field — additive in BOTH
# directions (serde default/skip), so unlike 0.16.2 a stale .kgl needs NO
# rebuild; saves pay the CRC pass (upstream ~+11-15%). The semantics change IS
# observable in query answers on cyclic graphs — pinned by
# crates/codingest/tests/traversal_semantics.rs, which is red on 0.16.5 and
# green on 0.16.6 by design.
#
# History — the 0.16.5 floor was a LOCKSTEP REFRESH, not a fix we needed:
# nothing in 0.16.3-0.16.5
# reaches a path codingest exercises, and the evidence is the gate rather than
# the changelog. `golden_parity` is green and `kgl_bytes_are_stable_across_builds`
# holds, so the frozen goldens are byte-identical across the bump; the fixture
# corpus builds 405 nodes / 616 edges docs-on and 398 / 596 docs-off on both
# 0.16.2 and 0.16.5. Perf is flat: three interleaved A/B pairs per docs mode on
# corpus ad8b3084…, control `defs_per_file` moving +0.0%, every cell flat except
# `varlen_callers_1_3` at -9.7% in BOTH modes (0.031 -> 0.028 ms) — a small
# consistent win, plausibly the PropMap refcount clone below. A same-machine
# before/after pair taken 20 minutes apart instead read +50% on three cells with
# the control at +15%; that is the instrument, and the interleaved pairs are why
# the flat reading is the one recorded (doctrine R11).
#
# What each release contains, and why none of it lands on us:
#   * 0.16.5 is a BREAKING Rust API change — node, relationship and map
#     properties are a `kglite::datatypes::PropMap`, not a
#     `BTreeMap<String, Value>`. We are not exposed: codingest names neither
#     `NodeValue::properties` nor `RelValue::properties`, and its one
#     `Value::Map` site (docs/mod.rs) matches the wildcard `Value::Map(_)` to
#     stringify a non-scalar, which binds nothing. The workspace compiles clean
#     with no source change. No file format moved — postcard's map framing is
#     identical — which is what lets the goldens hold. Also in 0.16.5:
#     relationship constraints, CDC before-images and selectors, and a
#     re-save determinism fix. codingest declares no constraints, consumes no
#     CDC, and only ever writes FRESH saves, so the re-save fix (and its
#     property-name reordering) cannot reach our bytes.
#   * 0.16.4 adds the opt-in parallel Cypher runtime (off by default and NOT
#     exposed by the MCP server), property-type constraints, and CDC v1. Its
#     one format note — a `.kgl` carrying a property-type constraint does not
#     load on 0.16.3 or earlier — is inert here because codingest declares
#     none, so our files stay readable by an older engine. That is why the
#     Python floor moves for LOCKSTEP, not because the format broke: the
#     `test_kglite_cargo_and_python_floors_are_in_lockstep` gate requires
#     Cargo.toml, pyproject.toml and ci.yml to state one floor, and a
#     "the reader could stay lower" argument is exactly the drift it exists to
#     stop.
#   * 0.16.3 is MCP-side: `reload_graph`, `extensions.graph_watch`, and
#     `extensions.tools_allow`. It also carries mcp-methods 0.4.5, which makes
#     the GitHub tools require an explicit `builtins.github: true` — codingest-mcp
#     registers no GitHub tools and ships no manifest declaring them, so its
#     agent-visible tool surface is unchanged.
#
# Floor history below; the 0.16.2 entry is the last one that changed our output.
# The 0.16.2 floor fixed the edge-property type registry: `add_connections` — the ONLY
# edge path codingest uses (builder/load.rs, other_edges.rs, cross_lang.rs,
# docs/mod.rs) — registered every property as "Unknown" instead of its observed
# type. Measured on a two-function Python corpus: `CALL
# db.schema.relTypeProperties()` answered `:CALLS.call_count -> ["Unknown"]`
# built on 0.16.1 and `["Long"]` built on 0.16.2. So this is output-affecting
# for schema consumers (graph_overview, Neo4j-shaped clients) and a real floor,
# not a lockfile refresh — but it is metadata beside the property values, so
# the frozen parity goldens are byte-identical across the bump. Per the
# changelog a graph written before the fix keeps its "Unknown"s until its edges
# are rewritten: a stale `.kgl` must be REBUILT, not just re-read on the new
# engine. Nothing else in 0.16.2 reaches us — it is Bolt-server Neo4j/APOC
# compatibility, Java binding work, and an `id(n)` projection fast path.
# It sits on the 0.16.1
# floor, which picks up the wire-JSON break (kglite_value_to_json emits real JSON for
# nine variants — our CLI renders through it, so expectations pin the NEW
# shapes and an older engine would fail them) on top of the 0.16.0
# base, which is a HARD floor, not a preference: 0.16.0 writes `.kgl` container v6,
# which kglite 0.15.14 and earlier refuse by version number. Because
# `codingest.build()` writes the bytes with the Rust engine compiled in here and
# reads them back through the separately-installed Python `kglite` wheel, the
# two sides must be on the same side of that break — hence `>=0.16.6,<0.17` in
# pyproject.toml, and hence a reader on 0.15.x is not "old but workable", it is
# a hard failure with `FileFormatError`.
# 0.16.0 also removed `DirGraph::enable_columnar` from the public API (every
# graph is columnar from its first node now); the two sites that open-coded
# `prepare_save` + `enable_columnar` before a `.kgl` write moved to the
# purpose-built `kglite::api::io::prepare_kgl_write`, which also keeps the
# graph's copy-on-write lineage across that mutation — our `Arc::make_mut`
# spelling did not.
# It sits on top of the 0.15.13 floor, which added a planner fix for joins
# filtered on a type's title/id field (anchored traversals 5.7-327x faster here;
# see BENCHMARKS.md 0.2.1), and the 0.15.11 floor before it, which brought three
# things, only one of which changed what we run:
#   * 0.15.10's `add_connections` resolves its edge-property columns once per
#     call instead of once per cell — upstream measured 66.7ms -> 30.4ms
#     (-54%) on 60k edges x 10 property columns. That is exactly the shape of
#     our `control_edges_df` handoff, so it lands on the `calls` stage.
#   * The `NodeData` -> `NodeView` API break from 0.15.9, made migratable in
#     0.15.11. 0.15.9 deleted `NodeData`'s inherent property accessors and
#     0.15.11 finally shipped reachable replacements: reads go through
#     `DirGraph::node_view(idx)`, and by-index writes through the inherent
#     `DirGraph::set_node_property(idx, "key", value)`. We migrated 21 read
#     sites and the 2 `revs`/`rev_fp` write sites in `rev.rs` for this floor.
#     It is a compile-time break only — the storage path behind both spellings
#     is the one the removed methods already called, so it is NOT
#     output-affecting.
#     NOTE: do NOT reach the write side via `GraphWrite::set_node_property`
#     with an `InternedKey::from_str` key. That key is never registered: it
#     reads back within the session but breaks property enumeration and is
#     silently dropped by `save_graph`. The inherent string-keyed calls
#     register the name; use them.
#   * 0.15.11's `kglite::api::embeddings` ingest API and `text_score()` query-
#     vector arguments — codingest consumes neither.
# Per the 0.15.9-0.15.11 changelogs, graph output, property encoding and
# `.kgl` serialization are unchanged; the frozen parity goldens are what
# proves it, and they must not move across this bump.
#
# Floor history. The 0.15.8
# floor added recorded storage modes, `--storage` conversion on an existing
# graph, and boot-validated Cypher recipe catalogs — none of which codingest
# consumes — plus two changes that do reach us: workspace-graph producers now
# receive deduplicated changed-path hints alongside full-build requests (our
# `with_workspace_graph` producer lives in codingest-mcp), and the optimized-
# plan cache no longer lets a write loop evict other graphs' cached read plans.
# `OpenGraphResult` gained a `converted_from` field — a documented struct-
# literal break we are not exposed to, as codingest constructs no
# `OpenGraphResult`. 0.15.7 aligned the embedded server on mcp-methods 0.4.4
# and rmcp 3.1.1; dynamic handlers use rmcp's response envelope while
# preserving their payloads and MCP behavior. The 0.15.6 engine fixes
# mixed-selection vector dispatch, mixed-metric exact search,
# community-detection modularity scoring, sampled-centrality validation, and
# persisted HNSW validation, while adding the bulk node-degree primitive and
# graph-algorithm/vector-search performance improvements. It builds on the two
# workspace controls codingest asked upstream for in 0.15.5:
# `workspace.sandbox_root`, a real containment boundary that confines
# `set_root_dir` to a subtree instead of trusting the caller's path, and
# `workspace.adopt_client_roots`. Both land on top of the generic
# workspace-graph hooks, tri-state `durable` levels, typed
# constraint/conflict exceptions carrying a stable `.code`, and the
# deterministic Postcard persistence stack inherited from 0.14.5/0.15.0-0.15.3.
# 0.15.4 is deliberately skipped: it was WAL/durability and mapped-graph work
# we consume none of — codingest uses no `durable=` level, no `MappedGraph`,
# and no disk storage. Neither 0.15.7 nor 0.15.8 changes the `kglite::api` we
# call, graph output, property encoding, or `.kgl` serialization.
# Keep both libraries aligned so the graph and server share one engine release.
kglite = { version = "0.16.6", default-features = false }
kglite-mcp-server = { version = "0.16.6", default-features = false }

# Mirror KGLite's release codegen so the standalone builder has
# performance parity with the in-tree component (see KGLite
# workspace Cargo.toml).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
