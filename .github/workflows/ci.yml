name: CI

# ─────────────────────────────────────────────────────────────────────────────
# THE kglite-0.14 GATE (read before wondering why the real jobs are "skipped").
#
# codingest builds against 0.14-only engine APIs (`kglite::api::code_entities`,
# `kglite_mcp_server::run_with_code_tree_hooks`) that are NOT in any 0.13.x
# crates.io release. A CI checkout has no sibling `../KGLite`, so the kglite
# path dep falls back to the crates.io version — which today is 0.13.4 and
# LACKS these symbols. The Rust + Python jobs would therefore fail to compile
# no matter what we pin (`0.13` resolves but misses symbols; `0.14` doesn't
# resolve at all yet). Rather than fake green (`continue-on-error` would paint a
# passing check over a real failure) or ship a permanently-red repo, the
# resolve/compile jobs are GATED behind a repository variable. Until it's set
# they are honestly *skipped* — not passed — and the always-on `preflight` job
# makes the gate state explicit on every run.
#
# TO ENABLE CI (one-time, at kglite 0.14.0 release):
#   1. Bump both `version = "0.13"` fallbacks in the root Cargo.toml to "0.14".
#   2. In the repo: Settings → Secrets and variables → Actions → Variables →
#      New repository variable → name `CODINGEST_KGLITE_READY`, value `true`.
#   3. (Optional cleanup) once 0.14 is stable, delete this gate: drop the
#      `preflight` job and the `if:` guards below so the real jobs always run.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight (kglite-0.14 gate status)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report gate state
        run: |
          if [ "${{ vars.CODINGEST_KGLITE_READY }}" = "true" ]; then
            echo "✅ CODINGEST_KGLITE_READY=true — Rust + Python jobs will run."
          else
            echo "⏳ CODINGEST_KGLITE_READY is not 'true' — Rust + Python jobs are"
            echo "   intentionally SKIPPED until kglite 0.14.0 is on crates.io."
            echo "   See the header comment in .github/workflows/ci.yml to enable."
          fi

  rust-checks:
    name: Rust checks (${{ matrix.os }})
    needs: [preflight]
    if: vars.CODINGEST_KGLITE_READY == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The codingest-py crate is a PyO3 extension (abi3, extension-module off
      # by default), so a plain `cargo build`/`clippy`/`test` of the workspace
      # links libpython — provide it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        # Includes crates/codingest/tests/parity.rs — the golden oracle
        # (golden_parity + rev_self_consistency). Goldens are committed
        # fixtures under crates/codingest/tests/goldens/; the test is offline.
        run: cargo test --workspace

  python:
    name: Python (${{ matrix.os }})
    needs: [preflight]
    if: vars.CODINGEST_KGLITE_READY == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Create venv and install build + runtime deps
        # `kglite>=0.14` is the runtime engine (the `.kgl`-bytes handoff loads
        # the built graph through the installed kglite wheel). maturin builds
        # the codingest extension into the venv.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin pytest "kglite>=0.14"

      - name: Build the codingest extension into the venv (maturin develop)
        run: .venv/bin/maturin develop --release

      - name: Run the codingest-py acceptance suite
        # pyproject `testpaths = ["tests/python"]` scopes collection — the
        # dormant tests/python-legacy/ tree is never swept in.
        run: .venv/bin/python -m pytest tests/python -v --tb=short
