[workspace]
members = [
    "crates/codingest",
    "crates/codingest-cli",
    "crates/codingest-mcp",
    "crates/codingest-py",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kkollsga/codingest"

[workspace.dependencies]
base64 = "0.22"
sha2 = "0.11"
# kglite engine + MCP server — imported as crates.io libraries. The 0.15.0
# floor brings tri-state `durable` levels with an on-demand `sync()` barrier,
# typed constraint/conflict exceptions carrying a stable `.code`, and the
# columnar-REMOVE correctness fix, on top of the generic workspace-graph hooks
# and deterministic Postcard persistence stack inherited from 0.14.5.
# Keep both libraries aligned so the graph and server share one engine release.
kglite = { version = "0.15.0", default-features = false }
kglite-mcp-server = { version = "0.15.0", default-features = false }

# Mirror KGLite's release codegen so the standalone builder has
# performance parity with the in-tree component (see KGLite
# workspace Cargo.toml).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
